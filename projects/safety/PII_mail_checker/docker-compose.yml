version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pii_user
      POSTGRES_PASSWORD: pii_password
      POSTGRES_DB: pii_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pii_user -d pii_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://pii_user:pii_password@postgres:5432/pii_monitor
      - SESSION_SECRET=your-production-secret-change-this
      - ML_ENABLED=true
      - CONFIDENCE_THRESHOLD=0.8
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./ml/models:/app/ml/models
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
